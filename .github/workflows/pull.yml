name: Validate Pull Request

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commitsar check
        uses: docker://aevea/commitsar:0.20.0

      - uses: php-actions/composer@v6
        with:
          command: validate
          version: 2.8.1
